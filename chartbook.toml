[project]
name = "Ken French Data Library"
description = "Fama-French 25 Portfolios sorted by Size and various characteristics"
contributors = [
    "Jeremiah Bejarano",
]
repo_url = "https://github.com/ftsfr/ken_french_data_library"
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]
requires_chartbook = ">=0.3.0"

[scripts]
build = "doit"

[notebooks.summary_ken_french_ipynb]
name = "summary_ken_french_ipynb"
description = "Summary statistics and visualization of Fama-French portfolio data"
path = "_output/summary_ken_french_ipynb.ipynb"
publishable = true

[dataframes.ftsfr_french_portfolios_25_daily_size_and_bm]
name = "ftsfr_french_portfolios_25_daily_size_and_bm"
description = "Daily Fama-French 25 portfolios sorted by Size and Book-to-Market"
sources = [
    "ken_french",
]
providers = [
    "Ken French",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html",
]
tags = [
    "portfolios",
    "equity",
    "factors",
]
access_types = [
    "Public",
]
license = "Public"
restrictions = "No"
pull_method = "Downloaded from Ken French Data Library"
path = "./_data/ftsfr_french_portfolios_25_daily_size_and_bm.parquet"
date_col = "ds"
docs = """
## Daily Fama-French 25 Portfolios (Size x Book-to-Market)

This dataset contains daily returns for 25 portfolios formed on size and book-to-market.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Portfolio identifier (e.g., \"SMALL LoBM\", \"BIG HiBM\") |
| ds | Date |
| y | Daily return (decimal) |

### Portfolio Construction

Portfolios are formed on Size (market equity) and Book-to-Market (book equity / market equity).
5x5 = 25 portfolios at the intersection of 5 size quintiles and 5 B/M quintiles.
"""

